[project]
name = "sawii-persona"
version = "0.1.0"
description = "Sawii Persona - a three-lobe AI companion with human-like memory, a sense of time, initiative, voice and sleep."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - Copyright (c) Anas AlSawy" }
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
deep = ["openhands-sdk"]

[project.scripts]
sawii-persona = "sawii_persona.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sawii_persona = ["web/*.html"]
